[project]
name = "map-backend"
version = "0.2.5"
description = "Multi-Agent Portal backend (FastAPI). Never talks to an LLM directly — shells out to the opencode binary."
license = { text = "MIT" }
authors = [{ name = "Ferry", email = "ferdevelop15@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "mcp>=2.0.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "coveralls>=4.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
omit = [
    "app/main.py",
    "app/db/session.py",
    "app/schemas/*",
    "app/mcp_server.py",
    "*/alembic/*",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
