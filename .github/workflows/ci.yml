name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev
      - name: Run tests with coverage
        working-directory: backend
        run: uv run pytest -q --cov-report=term-missing
      - name: Upload coverage to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          COVERALLS_SERVICE_NAME: github
          COVERALLS_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          COVERALLS_GIT_COMMIT: ${{ github.sha }}
        run: coveralls --basedir backend --data-file backend/.coverage --output backend/coveralls.json

  frontend:
    name: Frontend (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
